<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BB Instant Tester</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* 背景カメラ映像 */
        #video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        /* 3Dモデル表示エリア */
        model-viewer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            --poster-color: transparent;
            background-color: transparent;
        }

        /* 画面右下の「モデル読み込み」ボタン */
        .load-btn-container {
            position: absolute;
            bottom: 25px;
            right: 20px;
            z-index: 100;
        }

        /* 画面下中央の「カメラ起動」ボタン */
        .cam-btn-container {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 100;
        }

        .btn {
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s;
        }
        
        .btn:active { transform: scale(0.95); }

        #load-trigger { background: #ff4757; color: white; } /* 赤色：メインアクション */
        #cam-btn { background: #2f3542; color: white; opacity: 0.8; } /* 濃いグレー */

        #file-input { display: none; } /* 実際の入力フォームは隠す */

        /* ステータス表示 */
        #status {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            color: white; font-size: 12px; z-index: 200;
            background: rgba(0,0,0,0.6); padding: 6px 15px; border-radius: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="status">右下のボタンからGLBを選択してください</div>

    <video id="video-bg" autoplay playsinline></video>

    <model-viewer 
        id="mv"
        ar 
        ar-modes="scene-viewer webxr" 
        camera-controls 
        interaction-prompt="none"
        shadow-intensity="1"
        environment-image="neutral"
        autoplay
        touch-action="none">
    </model-viewer>

    <div class="cam-btn-container">
        <button id="cam-btn" class="btn">📸 背景カメラ</button>
    </div>

    <div class="load-btn-container">
        <label for="file-input">
            <div id="load-trigger" class="btn">📂 モデル読込</div>
        </label>
        <input type="file" id="file-input" accept=".glb">
    </div>

    <script>
        const mv = document.querySelector('#mv');
        const fileInput = document.querySelector('#file-input');
        const video = document.querySelector('#video-bg');
        const camBtn = document.querySelector('#cam-btn');
        const status = document.querySelector('#status');

        // 1. ファイルが選択された時の処理
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files;
            if (file) {
                // ローカル上のファイルにアクセスするためのURLを生成
                const url = URL.createObjectURL(file);
                mv.src = url;
                status.textContent = `表示中: ${file.name}`;
                
                // AndroidのScene Viewer用に絶対パスとして認識させる処理
                //（ローカルURLは特殊なため、そのままだとScene Viewerでエラーになる場合があるため
                // webxrモードを優先するか、ブラウザ内プレビューで確認してください）
            }
        });

        // 2. 背景カメラの起動
        camBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                video.style.display = 'block';
                camBtn.style.opacity = '1';
                camBtn.style.background = '#2ed573'; // 起動中は緑に
                status.textContent = "カメラ重畳モード有効";
            } catch (err) {
                alert("カメラの起動に失敗しました。HTTPS(GitHub Pages)で開き、許可を出してください。");
            }
        });
    </script>
</body>
</html>
