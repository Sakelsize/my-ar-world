<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BB Local Playground</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* 背面カメラ */
        #video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        /* 3Dモデル表示 */
        model-viewer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            --poster-color: transparent;
        }

        /* 操作UI */
        .controls {
            position: absolute;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; gap: 12px;
            width: 80%;
        }

        .btn {
            padding: 15px; border-radius: 12px; border: none;
            font-weight: bold; font-size: 16px; text-align: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* ファイル選択ボタンを装飾 */
        .file-label { background: #ff4757; color: white; }
        #file-input { display: none; }
        #cam-btn { background: #2f3542; color: white; }

        #status {
            position: absolute; top: 10px; left: 10px;
            color: white; font-size: 12px; z-index: 200;
            background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="status">GLBファイルを選択してください</div>

    <video id="video-bg" autoplay playsinline></video>

    <model-viewer 
        id="mv"
        ar 
        ar-modes="scene-viewer webxr" 
        camera-controls 
        interaction-prompt="none"
        shadow-intensity="1"
        environment-image="neutral"
        autoplay>
    </model-viewer>

    <div class="controls">
        <label for="file-input" class="btn file-label">📂 モデルを選択 (GLB)</label>
        <input type="file" id="file-input" accept=".glb">
        
        <button id="cam-btn" class="btn">📸 カメラを背景にする</button>
    </div>

    <script>
        const mv = document.querySelector('#mv');
        const fileInput = document.querySelector('#file-input');
        const video = document.querySelector('#video-bg');
        const camBtn = document.querySelector('#cam-btn');
        const status = document.querySelector('#status');

        // 1. ローカルファイルの読み込み処理
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files;
            if (file) {
                const url = URL.createObjectURL(file);
                mv.src = url; // 選択されたファイルを直接流し込む
                status.textContent = `表示中: ${file.name}`;
            }
        });

        // 2. カメラ起動処理
        camBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                video.style.display = 'block';
                camBtn.style.display = 'none';
                status.textContent = "カメラ重畳モード";
            } catch (err) {
                alert("カメラの起動に失敗しました。Chromeで開き、HTTPS接続であることを確認してください。");
            }
        });

        // エラーハンドリング
        mv.addEventListener('error', () => {
            status.textContent = "エラー: GLBを読み込めませんでした";
        });
    </script>
</body>
</html>
