<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BB Android Playground</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* 背景カメラ */
        #video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none; /* 初期状態は非表示 */
        }

        /* 3Dモデル表示 */
        model-viewer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            --poster-color: transparent;
            background-color: transparent;
        }

        /* UIコンテナ */
        .controls {
            position: absolute;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; gap: 10px;
        }

        button {
            padding: 15px 30px; border-radius: 50px; border: none;
            background: #fff; font-weight: bold; font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        #start-btn { background: #4285f4; color: white; }

        /* 本格ARボタン（AndroidのScene Viewer用） */
        .ar-button {
            background: #fff; border-radius: 10px; border: none;
            padding: 10px; position: absolute; top: 20px; right: 20px;
            z-index: 101;
        }
    </style>
</head>
<body>

    <video id="video-bg" autoplay playsinline></video>

    <model-viewer 
        id="mv"
        src="model.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        interaction-prompt="none"
        shadow-intensity="1"
        environment-image="neutral"
        autoplay
        min-camera-orbit="auto -infinity auto"
        max-camera-orbit="auto infinity auto">
        
        <button slot="ar-button" class="ar-button">
            📦 本格ARモードを起動
        </button>

    </model-viewer>

    <div class="controls">
        <button id="start-btn">📸 カメラを背景にする</button>
    </div>

    <script>
        const video = document.getElementById('video-bg');
        const btn = document.getElementById('start-btn');
        const mv = document.getElementById('mv');

        // AndroidのScene Viewer対策：相対パスを絶対パスに自動変換
        // これをしないとAndroid標準ARがモデルを見失うことがあります
        const modelUrl = new URL(mv.getAttribute('src'), window.location.href).href;
        mv.setAttribute('src', modelUrl);

        btn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                video.style.display = 'block'; // カメラを表示
                btn.style.display = 'none';    // ボタンを消す
            } catch (err) {
                alert("カメラの起動に失敗しました。GitHub Pages(HTTPS)で開いているか確認してください。");
                console.error(err);
            }
        });
    </script>
</body>
</html>
